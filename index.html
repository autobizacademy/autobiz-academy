<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoBiz Academy — Espace membres</title>
<meta name="robots" content="noindex">
<meta name="description" content="Accès réservé aux membres de la formation AutoBiz Academy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --noir:#0d0c0b; --noir2:#141312; --or:#c9a84c; --or2:#e0c476;
    --creme:#f5f4f0; --gris:#8a877f; --bord:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--noir); color:var(--creme);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .halo{position:fixed;inset:0;background:radial-gradient(60% 40% at 50% 0%,rgba(201,168,76,.10),transparent 70%);pointer-events:none}
  .carte{position:relative;width:100%;max-width:400px}
  .marque{text-align:center;margin-bottom:26px}
  .marque .nom{font-family:'Playfair Display',Georgia,serif;font-size:27px;font-weight:700;letter-spacing:.01em}
  .marque .nom em{color:var(--or);font-style:normal}
  .marque .sous{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gris);margin-top:8px}
  form{background:var(--noir2);border:0.5px solid var(--bord);border-radius:6px;padding:28px 24px}
  h1{font-size:18px;margin:0 0 5px;font-weight:600}
  .intro{font-size:13px;color:var(--gris);margin:0 0 22px;line-height:1.5}
  label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);margin-bottom:7px}
  .champ{margin-bottom:16px}
  input{
    width:100%;background:var(--noir);border:0.5px solid var(--bord);border-radius:3px;
    padding:13px;color:var(--creme);font-size:16px;font-family:inherit;outline:none;
  }
  input:focus{border-color:var(--or)}
  input::placeholder{color:#57544d}
  button{
    width:100%;background:var(--or);color:var(--noir);border:none;border-radius:3px;
    padding:15px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px;
  }
  button:hover{background:var(--or2)}
  button:disabled{opacity:.55;cursor:wait}
  .erreur{display:none;margin-top:14px;padding:11px 13px;border-radius:3px;
    background:rgba(190,90,90,.12);border:0.5px solid rgba(190,90,90,.35);color:#e9adad;font-size:13px;line-height:1.45}
  .pied{margin-top:22px;text-align:center;font-size:13px;color:var(--gris);line-height:1.9}
  .pied a{color:var(--or);text-decoration:none}
  .pied a:hover{text-decoration:underline}
  .sep{margin-top:18px;padding-top:18px;border-top:0.5px solid var(--bord)}
</style>
</head>
<body>
<div class="halo"></div>

<div class="carte">
  <div class="marque">
    <div class="nom">AutoBiz <em>Academy</em></div>
    <div class="sous">Espace membres</div>
  </div>

  <form id="f" autocomplete="on">
    <h1>Connexion</h1>
    <p class="intro">Entre l'email et le code d'accès qu'on t'a transmis après ton inscription.</p>

    <div class="champ">
      <label for="email">Ton email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="prenom@email.com" required>
    </div>

    <div class="champ">
      <label for="code">Ton code d'accès</label>
      <input id="code" name="code" type="text" autocomplete="one-time-code" placeholder="Code reçu par message" required>
    </div>

    <button id="b" type="submit">Accéder à la formation &rarr;</button>
    <div class="erreur" id="err"></div>
  </form>

  <div class="pied">
    <div>Code perdu ? <a id="wa" href="#" target="_blank" rel="noopener">Écris-nous sur WhatsApp</a></div>
    <div class="sep">Pas encore membre ? <a href="/bio.html">Découvrir la formation</a></div>
  </div>
</div>

<script>
(function () {
  var f = document.getElementById('f'),
      b = document.getElementById('b'),
      err = document.getElementById('err');

  document.getElementById('wa').href =
    'https://wa.me/33756946616?text=' +
    encodeURIComponent("Salut Sabry, j'ai perdu mon code d'accès à la formation AutoBiz Academy.");

  function suite() {
    var s = new URLSearchParams(location.search).get('suite') || '/formation';
    return /^\/[^/]/.test(s) ? s : '/formation';   /* jamais de redirection hors du site */
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    err.style.display = 'none';
    b.disabled = true;
    b.textContent = 'Vérification...';

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        code: document.getElementById('code').value
      })
    })
      .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
      .then(function (j) {
        if (j && j.ok) { location.href = suite(); return; }
        throw new Error((j && j.erreur) || 'Email ou code incorrect.');
      })
      .catch(function (e2) {
        err.textContent = e2.message || 'Connexion impossible. Réessaie dans un instant.';
        err.style.display = 'block';
        b.disabled = false;
        b.textContent = 'Accéder à la formation →';
      });
  });
})();
</script>
</body>
</html>
